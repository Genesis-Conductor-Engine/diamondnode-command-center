; Alembic configuration for the TORX Contextual Sovereignty Agent.
;
; sqlalchemy.url is deliberately empty: env.py reads TORX_DATABASE_URL (or
; TORX_TEST_DATABASE_URL) instead, so a connection string with a password can
; never be committed here.
;
;   alembic upgrade head          apply against $TORX_DATABASE_URL
;   alembic upgrade head --sql    render the DDL, no server required

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
